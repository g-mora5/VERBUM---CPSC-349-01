<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <div class="container">
      <a href="index.html" class="logo">Verbum</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="library.html" class="active">My Sets</a>

  <main class="container">

      </div>
      <div class="card">
        <h3>Data Structures</h3>
        <p>45 cards · 12 due</p>
        <div class="bar"><span style="width: 40%;"></span></div>
        <a href="set.html" class="btn">Open</a>
      </div>
      <div class="card">
        <h3>Spanish Verbs</h3>
        <p>28 cards · 4 due</p>
        <div class="bar"><span style="width: 78%;"></span></div>
        <a href="set.html" class="btn">Open</a>
      </div>
      <div class="card">
        <h3>Ancient Rome</h3>
        <p>28 cards · 15 due</p>
        <div class="bar"><span style="width: 22%;"></span></div>
        <a href="set.html" class="btn">Open</a>

    </div>

  <footer>
    <p>Verbum</p>
  </footer>
