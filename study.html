<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study — Verbum</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <div class="container">
      <a href="index.html" class="logo">Verbum</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="library.html">My Sets</a>
        <a href="create.html">Create</a>
        <a href="study.html" class="active">Study</a>
        <a href="progress.html">Progress</a>
        <a href="settings.html">Settings</a>
      </nav>
    </div>
  </header>

  <main class="container">

    <h1>Cell Structures</h1>
    <p class="muted">Card 3 of 8</p>
    <div class="bar"><span style="width: 37%;"></span></div>

    <!-- Click on the card to flip it -->
    <input type="checkbox" id="flip">
    <label for="flip" class="flipcard">
      <span class="front">Ribosome</span>
      <span class="back">Builds proteins from amino acids.</span>
    </label>
    <p class="muted" style="text-align:center;">Click the card to flip it, then rate how well you knew it.</p>

    <div class="ratings">
      <button type="button" class="btn btn-outline">Again</button>
      <button type="button" class="btn btn-outline">Hard</button>
      <button type="button" class="btn btn-outline">Good</button>
      <button type="button" class="btn btn-outline">Easy</button>
    </div>

    <p style="margin-top:20px;"><a href="library.html">End session</a></p>

  </main>

  <footer>
    <p>Verbum</p>
  </footer>

</body>
</html>
